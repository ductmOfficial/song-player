name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so commitlint can read every commit in a pull request.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          # Passed through an env var, never interpolated into the script: titles are user input.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

  # Runs the built app in Chrome: Playwright end-to-end tests with axe, with the Audius and
  # Deezer APIs answered from fixtures (AUDIUS_MOCK=1, see apps/web/src/mocks).
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner image ships Google Chrome; using it skips the browser download and the
      # system packages from apt. Playwright reads CHROME_PATH (apps/web/playwright.config.ts).
      - name: Use the runner's Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
            "$chrome" --version
          else
            echo "No Chrome on the runner; installing Playwright's Chromium."
            pnpm --filter web exec playwright install --with-deps chromium
          fi

      - name: Build
        run: pnpm turbo run build

      - name: End-to-end and accessibility
        run: pnpm --filter web e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
